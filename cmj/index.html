<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06101a"><title>Centro Maestro Jurídico del Perú</title><style>body{margin:0;background:#06101a;color:#dbe7ef;font-family:Segoe UI,Arial;display:grid;place-items:center;min-height:100vh}.l{text-align:center;padding:24px}.s{width:34px;height:34px;border:3px solid #284b64;border-top-color:#e2b958;border-radius:50%;margin:0 auto 14px;animation:r 1s linear infinite}button{padding:10px 16px}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div class="s"></div><b>Cargando Centro Maestro Jurídico del Perú…</b></div><script>(async()=>{try{let u=['bundle1.txt','bundle2.txt','bundle3.txt','bundle4.txt','bundle5.txt','bundle6.txt','bundle7.txt'];let a=await Promise.all(u.map(x=>fetch(x,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.text()})));document.open();document.write(a.join(''));document.close()}catch(e){document.body.innerHTML='<div class="l"><h1>No se pudo cargar el sistema</h1><p>Recarga la página para reintentar.</p><button onclick="location.reload()">Reintentar</button></div>'}})()</script></body></html>
